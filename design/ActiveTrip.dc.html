<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #006c49; } a:hover { color: #00422b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #eaefe9; color: #131b2e; overflow: hidden;">

  <svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; top: 0; left: 0; display: block;">
    <rect width="390" height="844" fill="#eaefe9"/>

    <rect x="122" y="326" width="158" height="112" rx="8" fill="#d6e7d2"/>
    <rect x="26" y="596" width="120" height="86" rx="8" fill="#d6e7d2"/>

    <g stroke="#dde3da" stroke-width="21" stroke-linecap="round">
      <path d="M116 120 V 660"/>
      <path d="M282 120 V 660"/>
      <path d="M6 440 H 384"/>
      <path d="M6 250 H 384"/>
      <path d="M6 584 H 384"/>
    </g>
    <g stroke="#ffffff" stroke-width="17" stroke-linecap="round">
      <path d="M116 120 V 660"/>
      <path d="M282 120 V 660"/>
      <path d="M6 440 H 384"/>
      <path d="M6 250 H 384"/>
      <path d="M6 584 H 384"/>
    </g>
    <g stroke="#f7faf6" stroke-width="7" stroke-linecap="round">
      <path d="M116 330 L 282 286"/>
      <path d="M198 250 V 440"/>
    </g>

    <g fill="#dde2e7" stroke="#d0d6dc" stroke-width="1">
      <rect x="24" y="150" width="76" height="70" rx="6"/>
      <rect x="150" y="146" width="94" height="74" rx="6"/>
      <rect x="296" y="152" width="72" height="66" rx="6"/>
      <rect x="26" y="352" width="76" height="72" rx="6"/>
      <rect x="26" y="470" width="76" height="64" rx="6"/>
      <rect x="150" y="470" width="94" height="64" rx="6"/>
      <rect x="296" y="470" width="72" height="64" rx="6"/>
    </g>

    <rect x="292" y="262" width="80" height="76" rx="6" fill="#c3ead6" stroke="#8fd4b4" stroke-width="1.5"/>

    <text x="64" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#4a5560">Union</text>
    <text x="197" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#4a5560">Library</text>
    <text x="332" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#00422b">SC</text>
    <text x="201" y="382" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5d7a63">Main Quad</text>

    <path d="M66 388 L116 384 L116 440 L282 436 L330 300" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 388 L116 384 L116 440 L282 436 L330 300" fill="none" stroke="#c3ccd4" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
    <path d="M66 388 L116 384 L116 440 L236 438" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="66" cy="388" r="7" fill="#4b41e1" stroke="#ffffff" stroke-width="3"/>

    <circle cx="236" cy="438" r="21" fill="#10b981" opacity="0.18"/>
    <circle cx="236" cy="438" r="11" fill="#10b981" stroke="#ffffff" stroke-width="3.5"/>

    <g transform="translate(330 300)">
      <path d="M0 12 C -9 2 -13 -3 -13 -8 A 13 13 0 1 1 13 -8 C 13 -3 9 2 0 12 Z" fill="#006c49" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="0" cy="-8" r="4.6" fill="#ffffff"/>
    </g>
  </svg>

  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 14px; display: flex; align-items: center; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; background: #006c49; border-radius: 9999px; box-shadow: 0 4px 14px rgba(0,66,43,0.3);">
      <span style="width: 9px; height: 9px; border-radius: 9999px; background: #6ffbbe;"></span>
      <span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: #ffffff;">RECORDING</span>
    </div>
    <span style="flex-grow: 1;"></span>
    <div style="display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px; background: #ffffff; border-radius: 9999px; box-shadow: 0 3px 12px rgba(19,27,46,0.14);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00422b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.2" r="1.8"/><path d="M11 21l1.6-5.4-2.8-2.6.9-4.4 3.4 2 2.6.9"/><path d="M7.6 12.4 9.7 8.6 13.1 10"/><path d="m12.6 15.6 2.6 2.2.9 3.2"/></svg>
      <span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; color: #131b2e;">Walking</span>
    </div>
  </div>

  <div style="position: absolute; right: 14px; top: 300px;">
    <div style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 9999px; background: #ffffff; box-shadow: 0 4px 14px rgba(19,27,46,0.18);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#006c49" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    </div>
  </div>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(19,27,46,0.16); padding-bottom: 22px;">

    <div style="display: flex; justify-content: center; padding-top: 8px;">
      <div style="width: 38px; height: 4px; border-radius: 9999px; background: #cdd5de;"></div>
    </div>

    <div style="padding: 14px 16px 0 16px; display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: #6c7a71;">DISTANCE</span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 30px;">0.70</span>
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; color: #3c4a42;">of 1.2 km</span>
      </div>
      <div style="width: 1px; background: #eaedff;"></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: #6c7a71;">ELAPSED</span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 30px;">8:12</span>
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; color: #3c4a42;">min</span>
      </div>
      <div style="width: 1px; background: #eaedff;"></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: #6c7a71;">PACE</span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 30px;">5.1</span>
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; color: #3c4a42;">km/h</span>
      </div>
    </div>

    <div style="margin: 14px 16px 0 16px; padding: 13px 14px; background: #d8f3e5; border-radius: 14px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#006c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8.5v7M10 10.2h3.2a1.8 1.8 0 0 1 0 3.6H10"/></svg>
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: #00422b; flex-grow: 1;">12 points on the line</span>
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; color: #3c4a42;">trip 3 of 5 today</span>
      </div>
      <div style="height: 7px; border-radius: 9999px; background: #ffffff; overflow: hidden;">
        <div style="width: 58%; height: 100%; background: #10b981; border-radius: 9999px;"></div>
      </div>
      <span style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 500; color: #3c4a42;">Stay on the suggested route so the trip can verify</span>
    </div>

    <div style="padding: 14px 16px 0 16px; display: flex; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 104px; height: 52px; border-radius: 14px; border: 1px solid #bbcabf; background: #ffffff;">
        <span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #3c4a42;">Pause</span>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: #10b981;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00422b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
        <span style="font-size: 16px; font-weight: 700; color: #00422b;">End trip</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
